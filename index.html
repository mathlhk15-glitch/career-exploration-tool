<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>진로 탐구 길잡이</title>
<meta name="description" content="희망 진로를 입력하면 우리 학교 교육과정과 연결된 탐구 주제, 탐구 질문, 활동 방법, 보고서 작성까지 단계별로 안내하는 고등학생용 진로 탐구 도우미">
<style>
:root{
  --bg:#f5f7fb; --surface:#ffffff; --surface-2:#eef2f9; --text:#1c2333; --muted:#5a6476; --line:#dce2ec;
  --primary:#3654d6; --primary-ink:#ffffff; --primary-soft:#e8edff;
  --accent:#0b8a66; --accent-soft:#e2f5ee;
  --warn:#a8520c; --warn-soft:#fff3e2;
  --radius:16px; --shadow:0 1px 2px rgba(20,30,60,.05),0 6px 18px rgba(20,30,60,.06);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#10131a; --surface:#1a1f2b; --surface-2:#232a38; --text:#e7ebf3; --muted:#a2abbd; --line:#2f3747;
    --primary:#8199ff; --primary-ink:#0d1222; --primary-soft:#232c4f;
    --accent:#4fd0a4; --accent-soft:#17382e;
    --warn:#f2a65e; --warn-soft:#3a2915;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:16px;line-height:1.7;word-break:keep-all;overflow-wrap:anywhere}
.wrap{max-width:780px;margin:0 auto;padding:0 16px}
a{color:var(--primary)}
h1,h2,h3{line-height:1.35;margin:0}
p{margin:.4em 0}
ul,ol{margin:.4em 0;padding-left:1.3em}
li{margin:.3em 0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.sr{position:absolute;left:-9999px}

/* 상단 */
.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.top .wrap{display:flex;align-items:center;gap:10px;min-height:56px;padding-top:6px;padding-bottom:6px}
.brand{font-weight:800;font-size:17px;display:block;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;background:none;border:0;padding:0;min-height:44px}
.progress{flex:none;display:flex;gap:4px;margin-left:auto;list-style:none;padding:0;margin-top:0;margin-bottom:0}
.progress li{margin:0;font-size:12.5px;color:var(--muted);padding:3px 9px;border-radius:999px;background:var(--surface-2);white-space:nowrap}
.progress li.on{background:var(--primary);color:var(--primary-ink);font-weight:700}
.progress li.done{color:var(--primary);font-weight:600}
.progress li.done::before{content:"✓ "}
@media (max-width:520px){ .progress li:not(.on) span{display:none} .progress li{padding:3px 6px} .progress{gap:3px} .brand{font-size:15px} }

main{padding:24px 0 48px}
.hero{padding:8px 0 16px}
.hero h1{font-size:clamp(24px,5.5vw,32px);font-weight:800;letter-spacing:-.02em}
.hero p{color:var(--muted);font-size:16.5px}
.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0 8px}
.flow div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;font-size:14px;color:var(--muted)}
.flow b{display:block;color:var(--text);font-size:15px}
@media (max-width:520px){ .flow{grid-template-columns:1fr} }

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin:16px 0}
.card h2{font-size:20px;margin-bottom:6px}
.lead{color:var(--muted);margin-bottom:14px}
.label{display:block;font-weight:700;margin-bottom:8px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:650;cursor:pointer;text-decoration:none;color:var(--text)}
.btn:hover{border-color:var(--primary)}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:transparent}
.btn.ghost{background:transparent}
.btn.small{min-height:44px;padding:6px 12px;font-size:14px;border-radius:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.grade-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grade-btn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;min-height:110px}
.grade-btn:hover{border-color:var(--primary)}
.grade-btn b{font-size:22px}
.grade-btn em{font-style:normal;font-weight:700;color:var(--primary);font-size:14px}
.grade-btn small{color:var(--muted);font-size:13.5px;line-height:1.5}
@media (max-width:520px){ .grade-grid{grid-template-columns:1fr} .grade-btn{min-height:auto;flex-direction:row;align-items:center;gap:12px;flex-wrap:wrap} }

.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;min-height:52px;font:inherit;font-size:17px;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--text)}
.search input:focus{border-color:var(--primary);outline:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);font-size:14.5px;cursor:pointer;line-height:1.4}
.chip:hover{border-color:var(--primary)}
button.chip{min-height:44px}
.chip[aria-pressed="true"]::before{content:"✓";font-weight:800}
.chip.subj{background:var(--accent-soft);border-color:transparent;color:var(--text);cursor:default;border-radius:8px}
.chip.subj:hover{border-color:transparent}
.chip.subj.later{background:transparent;border:1px dashed var(--accent)}
.hint{font-size:14px;color:var(--muted)}
.mt{margin-top:16px}
.mt-s{margin-top:8px}

.cluster{margin-top:18px}
.cluster h3{font-size:15px;color:var(--muted);margin-bottom:8px}
.field-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.field-btn{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);cursor:pointer}
.field-btn:hover{border-color:var(--primary)}
.field-btn .ico{font-size:24px}
.field-btn b{font-size:16.5px}
.field-btn small{color:var(--muted);font-size:13px;line-height:1.5}
@media (max-width:520px){
  .field-btn{display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:center;padding:10px 14px}
  .field-btn .ico{grid-row:span 2}
  .field-btn small{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
}

.topic{display:block;width:100%;text-align:left;cursor:pointer;background:var(--surface);border:2px solid var(--line);border-radius:var(--radius);padding:18px;margin:12px 0}
.topic:hover{border-color:var(--primary)}
.topic h3{font-size:18px;margin:6px 0}
.topic p{color:var(--muted);font-size:15px}
.topic .go{display:inline-block;margin-top:8px;font-weight:700;color:var(--primary)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12.5px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.tag.rec{background:var(--primary);color:var(--primary-ink)}
.tag.m{background:var(--accent-soft);color:var(--accent)}
.tag.k{background:transparent;border:1px solid var(--line);color:var(--text)}
.group-title{font-size:15px;color:var(--muted);font-weight:700;margin:24px 0 4px}

.notice{border-radius:12px;padding:12px 14px;background:var(--surface-2);font-size:15px}
.notice.warn{background:var(--warn-soft);border-left:4px solid var(--warn)}
.notice.warn b{color:var(--warn)}
.notice.ok{background:var(--accent-soft)}
.notice.k{background:var(--primary-soft)}

details.kyeol{margin-top:12px}
details.kyeol summary{cursor:pointer;font-weight:700;color:var(--primary);min-height:44px;display:flex;align-items:center}
.kgrid{display:grid;gap:8px;margin-top:10px}
.kgrid div{padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:14.5px}

.subj-group{margin-top:10px}
.subj-group .label{font-size:14.5px;margin-bottom:6px}

/* 탐구 사례 */
.chip.on{background:var(--primary);color:var(--primary-ink);border-color:transparent}
.kbar{display:flex;height:14px;border-radius:99px;overflow:hidden;margin:10px 0 6px;background:var(--surface-2)}
.kbar i{display:block;height:100%}
.klegend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13.5px;color:var(--muted)}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.case-tools{display:grid;gap:10px;margin:14px 0 10px}
.case-tools input[type=search]{width:100%;min-height:44px;font:inherit;font-size:16px;padding:8px 12px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--text)}
.case-tools input[type=search]:focus{border-color:var(--primary);outline:none}
.case-tools label{font-size:14.5px;display:flex;gap:8px;align-items:center}
.case-list{list-style:none;padding:0;display:grid;gap:8px;margin:0}
.case-list li{margin:0;padding:6px 0 6px 12px;border-left:3px solid var(--line)}
.case-list .t{display:block;font-weight:600;margin-bottom:4px}
.case-list .m{display:block;font-size:13px;color:var(--muted);margin-top:4px}
.tag.ai{background:transparent;border:1px solid var(--line)}

/* 안내 페이지 */
.topic-head .field{font-size:14px;color:var(--muted);font-weight:600}
.topic-head h1{font-size:clamp(21px,4.6vw,27px);margin:6px 0 10px;letter-spacing:-.01em}
.meta{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px;margin-top:14px}
.meta dt{color:var(--muted);font-weight:600}
.meta dd{margin:0}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}

.step-nav{position:sticky;top:56px;z-index:5;background:var(--bg);padding:8px 16px;margin:0 -16px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.step-nav::-webkit-scrollbar{display:none}
.step-nav button{flex:none;min-height:44px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;white-space:nowrap}
.step-nav button:hover{border-color:var(--primary)}

.section{scroll-margin-top:120px}
.section h2{display:flex;align-items:center;gap:10px;font-size:20px;margin-bottom:4px}
.num{flex:none;display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:10px;background:var(--primary);color:var(--primary-ink);font-size:15px;font-weight:800}
.section h3{font-size:16px;margin:18px 0 6px}
.why{color:var(--muted);margin:0 0 12px;font-size:15px}

.qlist{display:grid;gap:10px}
.q{border:2px solid var(--line);border-radius:14px;padding:14px}
.q.rec{border-color:var(--primary);background:var(--primary-soft)}
.q .lv{font-size:13px;font-weight:800;color:var(--muted)}
.q.rec .lv{color:var(--primary)}
.q p{font-weight:600;font-size:16px;margin:4px 0 8px}

textarea{width:100%;min-height:90px;font:inherit;font-size:16px;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--text);resize:vertical}
textarea:focus{border-color:var(--primary);outline:none}

.check{list-style:none;padding:0}
.check li{margin:6px 0}
.check label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;padding:8px 10px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
.check label:hover{border-color:var(--primary)}
.check input{flex:none;width:20px;height:20px;margin-top:3px;accent-color:var(--accent)}
.check input:checked + span{color:var(--muted)}
.check .n{font-weight:800;color:var(--primary);margin-right:4px}

.src{display:grid;gap:8px;list-style:none;padding:0}
.src li{margin:0;padding:6px 0 6px 12px;border-left:3px solid var(--line)}
.src b{display:block}
.src small{color:var(--muted);font-size:14px}

.sched{display:grid;gap:6px}
.sched div{display:flex;gap:12px;padding:6px 0 6px 12px;border-left:3px solid var(--line);font-size:15px}
.sched b{flex:none;min-width:64px;color:var(--primary)}

.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:600px){ .two{grid-template-columns:1fr} }
.box{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.box h3{margin-top:0}

.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:15px;opacity:0;pointer-events:none;transition:.25s;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

footer{border-top:1px solid var(--line);padding:20px 0 32px;font-size:13.5px;color:var(--muted)}
.print-only{display:none}

@media print{
  :root{--bg:#fff;--surface:#fff;--surface-2:#f3f4f6;--text:#000;--muted:#444;--line:#bbb;--primary:#1d3fb8;--primary-ink:#fff;--primary-soft:#fff;--accent-soft:#eef;--shadow:none}
  body{font-size:12.5pt}
  .top,.step-nav,.no-print,.toast{display:none !important}
  footer{font-size:9.5pt;padding:8px 0 0;border-top:1px solid #bbb}
  .print-only{display:block}
  main{padding:0}
  .card{box-shadow:none;break-inside:auto;margin:10px 0}
  .q,.check label,.src li{break-inside:avoid}
  .src a::after{content:" (" attr(href) ")";font-size:10pt;color:#444}
  textarea{display:none}
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <button class="brand" type="button" data-home aria-label="처음 화면으로">🧭 진로 탐구 길잡이</button>
    <ol class="progress" id="progress" aria-label="진행 단계">
      <li>1<span> 학년</span></li>
      <li>2<span> 진로</span></li>
      <li>3<span> 주제</span></li>
      <li>4<span> 탐구 안내</span></li>
    </ol>
  </div>
</header>

<main class="wrap" id="app" tabindex="-1"></main>

<footer class="wrap">
  <p>🔒 입력한 내용은 어디에도 전송되지 않아요. 체크 표시와 내가 쓴 질문은 지금 쓰는 기기의 브라우저에만 저장돼요. 이름 같은 개인정보는 입력하지 마세요.</p>
  <p id="schoolNote"></p>
  <p>초안 v0.3 · 교내 진학 상담용</p>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* =========================================================
   1. 우리 학교 교육과정 (2026학년도 입학생 3개년 교육과정 편제표, 2022 개정)
   ========================================================= */

const SCHOOL = {
  name: '창원경일고',
  source: '2026학년도 입학생 3개년 교육과정 편제표',
  // 1학년: 공통과목 + 선택군G(기술·가정 / 정보)
  1: ['공통국어1·2', '공통수학1·2', '공통영어1·2', '한국사1·2', '통합사회1·2', '통합과학1·2', '과학탐구실험1·2', '체육1·2', '음악·미술', '기술·가정', '정보'],
  // 2학년: 학교 지정 + 선택군 A~F
  2: ['문학', '화법과 언어', '대수', '미적분Ⅰ', '영어Ⅰ', '영어Ⅱ', '스포츠 생활1·2',
      '주제 탐구 독서', '문학과 영상', '영어 발표와 토론', '인공지능 수학', '실용 통계',
      '세계시민과 지리', '세계사', '현대사회와 윤리', '사회와 문화', '법과 사회', '물리학', '화학', '생명과학', '지구과학',
      '일본어', '중국어',
      '독서 토론과 글쓰기', '영미 문학 읽기', '기하',
      '도시의 미래 탐구', '동아시아 역사 기행', '윤리와 사상', '정치', '경제', '역학과 에너지', '물질과 에너지', '세포와 물질대사', '지구시스템과학',
      '로봇과 공학세계', '인공지능 기초', '일본 문화', '중국 문화'],
  // 3학년: 학교 지정 + 선택군 H~M
  3: ['독서와 작문', '직무 의사소통', '확률과 통계', '수학과제 탐구', '영어 독해와 작문', '심화 영어', '스포츠 과학', '스포츠 문화', '논술',
      '언어생활 탐구', '심화 영어 독해와 작문', '경제 수학', '미적분Ⅱ',
      '한국지리 탐구', '금융과 경제생활', '사회문제 탐구', '전자기와 양자', '화학 반응의 세계', '생물의 유전', '행성우주과학', '물리학 실험', '화학 실험', '생명과학 실험',
      '음악 감상과 비평', '미술 감상과 비평',
      '생태와 환경', '인간과 심리',
      '매체 의사소통', '세계 문화와 영어', '고급 미적분',
      '여행지리', '윤리문제 탐구', '역사로 탐구하는 현대 세계', '융합과학 탐구', '과학의 역사와 문화', '기후변화와 환경생태']
};

// 2학년 과목 → 그 바탕이 되는 1학년 과목
const BASE_OF = {};
Object.entries({
  '통합과학1·2': ['물리학', '화학', '생명과학', '지구과학', '역학과 에너지', '물질과 에너지', '세포와 물질대사', '지구시스템과학'],
  '통합사회1·2': ['세계시민과 지리', '현대사회와 윤리', '사회와 문화', '법과 사회', '도시의 미래 탐구', '윤리와 사상', '정치', '경제'],
  '한국사1·2': ['세계사', '동아시아 역사 기행'],
  '공통수학1·2': ['대수', '미적분Ⅰ', '기하', '인공지능 수학', '실용 통계'],
  '공통국어1·2': ['문학', '화법과 언어', '주제 탐구 독서', '문학과 영상', '독서 토론과 글쓰기'],

const uniq = list => [...new Set(list)];
const in3 = list => uniq(list.filter(s => SCHOOL[3].includes(s)).concat(list.flatMap(s => NEXT_OF[s] || [])));

// 학년에 맞게 과목을 묶어서 돌려줌: [[제목, 과목들, 점선 표시 여부], ...]
function gradeSubjects(list, g) {
  if (g === 1) {
    const now = uniq(list.flatMap(s => SCHOOL[1].includes(s) ? [s] : (BASE_OF[s] ? [BASE_OF[s]] : [])));
    const later = uniq(list.filter(s => SCHOOL[2].includes(s)));
    return [['지금 배우는 과목 (1학년)', now, false], ['2학년 때 선택해 볼 과목', later, true]];
  }
  if (g === 2) {
    const now = uniq(list.filter(s => SCHOOL[2].includes(s)));
    return [['2학년 관련 과목', now, false], ['3학년 때 이어서 선택해 볼 과목', in3(list), true]];
  }
  const before = uniq(list.filter(s => SCHOOL[2].includes(s)));
  return [['3학년 관련 과목', in3(list), false], ['2학년 때 배운 바탕 과목', before, true]];
}

const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));

// 받침 여부에 따라 조사 붙이기: j('간호사', '은/는') → '간호사는'
function j(word, pair) {
  const [withBatchim, without] = pair.split('/');
  const code = word.trim().slice(-1).charCodeAt(0) - 0xAC00;
  if (code < 0 || code > 11171) return word + withBatchim + '(' + without + ')';
  return word + (code % 28 ? withBatchim : without);
}

const store = {
  get(key) { try { return JSON.parse(localStorage.getItem(key)) || null; } catch (e) { return null; } },
  set(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) { } },
  del(key) { try { localStorage.removeItem(key); } catch (e) { } }
};

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast.timer);
  // 글이 길수록 오래 보여 줌 (2.5~5초)
  toast.timer = setTimeout(() => t.classList.remove('show'), Math.min(5000, Math.max(2500, msg.length * 120)));
}

function copyText(text) {
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { }
    ta.remove();
    toast(ok ? '복사했어요' : '복사하지 못했어요. 직접 선택해서 복사해 주세요.');
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => toast('복사했어요'), fallback);
  } else {
    fallback();
  }
}

/* 주소(#)로 화면 상태를 관리해서 뒤로 가기·새로 고침이 자연스럽게 동작하게 함 */
function readState() {
  const p = new URLSearchParams(location.hash.slice(1));
  const s = {};
  for (const key of ['g', 'f', 't', 'k', 'm']) if (p.get(key)) s[key] = p.get(key);
  if (s.g && !GRADES[s.g]) return {};
  return s;
}
function go(s) {
  const p = new URLSearchParams();
  for (const key of ['g', 'f', 't', 'k', 'm']) if (s[key]) p.set(key, s[key]);
  const next = '#' + p.toString();
  if (location.hash === next) render(); else location.hash = next;
}

function getField(s) {
  if (s.f === 'gen') return s.k ? buildGenericField(s.k) : null;
  return FIELDS.find(f => f.id === s.f) || null;
}

function matchFields(input) {
  const norm = input.toLowerCase().replace(/\s+/g, '');
  if (!norm) return [];
  return FIELDS.map(f => {
    const words = f.keywords.concat(f.careers).map(w => w.toLowerCase().replace(/\s+/g, ''));
    // 맞은 글자 수만큼 점수를 줘서, 우연히 겹친 짧은 단어(예: '전기자동차' 속 '기자')보다 긴 단어가 이기게 함
    const score = words.reduce((sum, w) => sum + (norm.includes(w) || (norm.length >= 2 && w.includes(norm)) ? Math.min(w.length, norm.length) : 0), 0);
    return { f, score };
  }).filter(x => x.score > 0).sort((a, b) => b.score - a.score);
}

function setProgress(step) {
  document.querySelectorAll('#progress li').forEach((li, i) => {
    li.className = i + 1 === step ? 'on' : (i + 1 < step ? 'done' : '');
    if (i + 1 === step) li.setAttribute('aria-current', 'step'); else li.removeAttribute('aria-current');
  });
}

const KEYS = ['exp', 'data', 'soc', 'lit', 'cmp'];
const KCOLOR = { exp: '#e07b39', data: '#3d82c9', soc: '#8b5fd0', lit: '#2f9e6e', cmp: '#c99a1e' };
// 이 결의 탐구를 했다면 다음에는 어느 결로 넓혀 볼지 (탐구 지도의 상담 요령을 따름)
const NEXT_KYEOL = { exp: 'lit', data: 'exp', soc: 'data', lit: 'exp', cmp: 'data' };
const MAP_TIP = '학생의 탐구가 어느 결에 몰려 있는지 먼저 보세요. 조사와 비교에만 머물러 있다면 다음 단계는 검증입니다. 자료를 모으는 데서 그치지 말고 직접 확인하거나 수치로 따져보게 하세요. 반대로 실험만 많다면 그 결과가 어떤 의미인지 문헌으로 뒷받침하도록 이끌어 주세요.';
const norm = s => String(s || '').toLowerCase().replace(/\s+/g, '');

function fieldCases(field, k) {
  if (field.generic) {
    const q = norm(k);
    return {
      map: MAP_CASES.filter(c => q && (norm(c[0]).includes(q) || norm(c[4]).includes(q))),
      ai: AI_CASES.filter(a => q && (norm(a[0]).includes(q) || norm(a[2]).includes(q)))
    };
  }
  return { map: MAP_CASES.filter(c => c[9].includes(field.id)), ai: AI_CASES.filter(a => a[1] === field.id) };
}

function kyeolSummary(list) {
  if (!list.length) return '';
  const cnt = Object.fromEntries(KEYS.map(k => [k, list.filter(c => c[7] === k).length]));
  const top = KEYS.slice().sort((a, b) => cnt[b] - cnt[a])[0];
  return `
    <div class="kbar" role="img" aria-label="탐구의 결 분포">${KEYS.filter(k => cnt[k]).map(k => `<i style="width:${cnt[k] / list.length * 100}%;background:${KCOLOR[k]}"></i>`).join('')}</div>
    <div class="klegend">${KEYS.map(k => `<span><span class="dot" style="background:${KCOLOR[k]}"></span>${esc(KYEOL[k].name)} ${cnt[k]}</span>`).join('')}</div>
    <p class="mt-s">가장 두터운 결은 <b>${esc(KYEOL[top].name)}</b>(${cnt[top]}건, ${Math.round(cnt[top] / list.length * 100)}%)이에요. ${esc(KYEOL[top].desc)}</p>`;
}

function mapCaseItem(c) {
  const guess = c[8] === '추정' || c[8] === '지면추정';
  const where = [c[4] && (c[4] + (guess ? ' (학과 연결 추정)' : '')), c[5] && c[5] + ' 계열', c[6] && '교과: ' + c[6]].filter(Boolean).join(' · ');
  return `<li><span class="t">${esc(c[0])}</span>
    <div class="tags">${kyeolTag({ kyeol: c[7] })}</div>
    <span class="m">${esc(c[1])} ${esc(c[2])}학년도 가이드북 p.${esc(c[3])}${where ? ' · ' + esc(where) : ''}</span></li>`;
}

function aiCaseItem(a) {

function casePanel(field, k) {
  const { map, ai } = fieldCases(field, k);
  return `

          ${KEYS.map(x => `<button class="chip" type="button" data-cf="${x}" aria-pressed="false">${KYEOL[x].icon} ${esc(KYEOL[x].name)}</button>`).join('')}
        </div>
        <div class="chips" id="caseSrc">
          <button class="chip on" type="button" data-cs="map" aria-pressed="true">합격생 사례</button>
          <button class="chip on" type="button" data-cs="ai" aria-pressed="true">AI 추가 사례</button>
        </div>

        <label><input id="caseAll" type="checkbox"> 모든 분야의 사례에서 찾기</label>
      </div>
      <p class="hint" id="caseCount"></p>
      <ul class="case-list" id="caseList"></ul>
      <div class="row mt-s no-print"><button class="btn small" type="button" id="caseMore">더 보기</button></div>
    </section>`;
}

function bindCasePanel(field, k) {
  const st = { kyeol: '', src: { map: true, ai: true }, q: '', all: false, limit: 12 };
  const listEl = document.getElementById('caseList');
  const draw = () => {
    const base = st.all ? { map: MAP_CASES, ai: AI_CASES } : fieldCases(field, k);
    const q = norm(st.q);
    const hit = (text) => !q || norm(text).includes(q);
    const map = st.src.map ? base.map.filter(c => (!st.kyeol || c[7] === st.kyeol) && hit(c[0] + c[4] + c[6])) : [];
    const ai = st.src.ai ? base.ai.filter(a => (!st.kyeol || a[4] === st.kyeol) && hit(a[0] + a[2] + a[3])) : [];
    const items = map.map(mapCaseItem).concat(ai.map(aiCaseItem));
    listEl.innerHTML = items.slice(0, st.limit).join('') || '<li>조건에 맞는 사례가 없어요. 검색어를 바꾸거나 “모든 분야”를 켜 보세요.</li>';
    document.getElementById('caseCount').textContent = `${items.length}건 중 ${Math.min(st.limit, items.length)}건 표시`;
    document.getElementById('caseMore').hidden = items.length <= st.limit;
  };
  document.getElementById('caseKyeol').addEventListener('click', e => {
    const b = e.target.closest('[data-cf]'); if (!b) return;
    st.kyeol = b.dataset.cf; st.limit = 12;
    b.parentNode.querySelectorAll('.chip').forEach(x => { x.classList.toggle('on', x === b); x.setAttribute('aria-pressed', String(x === b)); });
    draw();
  });
  document.getElementById('caseSrc').addEventListener('click', e => {
    const b = e.target.closest('[data-cs]'); if (!b) return;
    st.src[b.dataset.cs] = !st.src[b.dataset.cs]; st.limit = 12;
    b.classList.toggle('on', st.src[b.dataset.cs]);
    b.setAttribute('aria-pressed', String(st.src[b.dataset.cs]));
    draw();
  });
  document.getElementById('caseSearch').addEventListener('input', e => { st.q = e.target.value; st.limit = 12; draw(); });
  document.getElementById('caseAll').addEventListener('change', e => { st.all = e.target.checked; st.limit = 12; draw(); });
  document.getElementById('caseMore').addEventListener('click', () => { st.limit += 12; draw(); });
  draw();
}

  const myQ = document.getElementById('myQ');

    const data = { checks: {}, myQ: myQ.value };
    app.querySelectorAll('[data-ck]').forEach(c => { if (c.checked) data.checks[c.dataset.ck] = true; });
    store.set(storageKey(s), data);
    updateDone();
  };
  const updateDone = () => {
    const all = app.querySelectorAll('[data-ck]');
    const done = app.querySelectorAll('[data-ck]:checked').length;
    document.getElementById('doneText').textContent = `할 일 ${all.length}개 중 ${done}개 완료`;
    document.getElementById('doneBar').style.width = (all.length ? done / all.length * 100 : 0) + '%';
    myQPrint.textContent = myQ.value ? '내 탐구 질문: ' + myQ.value : '내 탐구 질문: ______________________________';
  };
  app.querySelectorAll('[data-ck]').forEach(c => c.addEventListener('change', save));
  myQ.addEventListener('input', save);
  app.querySelectorAll('[data-useq]').forEach(b => b.addEventListener('click', () => {
    myQ.value = t.questions[Number(b.dataset.useq)];
    save();
    myQ.focus();
    toast('내 탐구 질문에 넣었어요. 내 말로 다듬어 보세요!');
  }));
  app.querySelector('[data-reset]').addEventListener('click', () => {
    if (!confirm('이 주제에 체크한 내용과 내가 쓴 질문을 지울까요?')) return;
    store.del(storageKey(s));
    render();
    toast('기록을 지웠어요');
  });
  app.querySelector('[data-copyall]').addEventListener('click', () => copyText(guideText(field, t, g, myQ.value)));
  updateDone();
}

function guideText(field, t, g, myQ) {
  const gd = GRADES[g];
  const k = KYEOL[t.kyeol];
  const L = [];
  L.push(`[진로 탐구 계획] ${t.title}`, `${field.name} · ${gd.label} ${gd.title} · 추천 기간 ${gd.period}`, '');
  L.push('■ 진로 연결: ' + t.link);
  L.push(`■ 탐구의 결: ${k.kid} (${k.name})`);
  gradeSubjects(t.subjects, g).filter(([, items]) => items.length).forEach(([title, items]) => L.push(`■ ${title}: ${items.join(', ')}`));
  L.push('', '1. 탐구 질문');
  L.push('  내 질문: ' + (myQ || '(아직 정하지 않음)'));
  t.questions.forEach((q, i) => L.push(`  - ${LEVELS[i]}: ${q}`));
  L.push('', '2. 조사할 내용');
  t.research.forEach(x => L.push('  - ' + x));
  L.push('', '3. 추천 검색어: ' + t.keywords.join(', '), '');
  L.push('4. 활동 순서');
  t.steps.forEach((x, i) => L.push(`  ${i + 1}) ${x}`));
  L.push('', '5. 결과 정리');
  gd.organize.forEach(x => L.push('  - ' + x));
  L.push('', `6. 보고서: ${gd.report.form} / 발표: ${gd.report.talk}`, '');
  L.push('7. 후속 탐구 아이디어');
  t.next.forEach(x => L.push('  - ' + x));
  L.push('  - 다른 결로 넓히기: ' + k.next);
  return L.join('\n');
}

function render() {
  const s = readState();
  let field, topic;
  if (!s.g) renderHome();
  else if (s.m && s.k) renderChoose(s);
  else if (!s.f || !(field = getField(s))) renderCareer(s);
  else if (!s.t || !(topic = field.topics.find(t => t.id === s.t))) renderTopics(s, field);
  else renderGuide(s, field, topic);
  window.scrollTo(0, 0);
}

// 화면이 바뀌면 키보드 포커스를 새 화면의 제목으로 옮김 (입력칸에 이미 포커스가 있으면 그대로 둠)
function moveFocus() {
  if (app.contains(document.activeElement) && document.activeElement.matches('input, textarea')) return;
  const h = app.querySelector('h1, h2');
  if (!h) return;
  h.setAttribute('tabindex', '-1');
  h.focus({ preventScroll: true });
}

/* =========================================================
   6. 클릭·입력 처리
   ========================================================= */

document.addEventListener('click', e => {
  const el = e.target.closest('button');
  if (!el) return;
  const s = readState();
  const d = el.dataset;
  if ('home' in d) go({});
  else if (d.grade) go({ g: d.grade });
  else if (d.try) { document.getElementById('careerInput').value = d.try; search(s.g, d.try); }
  else if (d.field) go({ g: s.g, f: d.field, k: s.k });
  else if ('generic' in d) go({ g: s.g, f: 'gen', k: s.k });
  else if (d.topic) go({ g: s.g, f: s.f, k: s.k, t: d.topic });
  else if (d.back === 'home') go({});
  else if (d.back === 'career') go({ g: s.g, k: s.k });
  else if (d.back === 'topics') go({ g: s.g, f: s.f, k: s.k });
  else if (d.jump) document.getElementById(d.jump).scrollIntoView({ behavior: 'smooth', block: 'start' });
  else if (d.copy) copyText(d.copy);
  else if ('print' in d) window.print();
});

document.addEventListener('submit', e => {
  if (e.target.id !== 'careerForm') return;
  e.preventDefault();
  const value = document.getElementById('careerInput').value.trim();
  if (!value) { toast('희망 진로나 관심 분야를 입력해 주세요'); return; }
  search(readState().g, value);
});

// 한 분야가 다른 분야보다 더 많이 맞으면 바로 이동, 비슷하면 고르게 함
function search(g, value) {
  const k = value.trim().slice(0, 30);
  const matches = matchFields(k);
  if (matches.length && (matches.length === 1 || matches[0].score > matches[1].score)) go({ g, f: matches[0].f.id, k });
  else go({ g, k, m: '1' });
}

document.getElementById('schoolNote').textContent =
  `📚 과목은 ${SCHOOL.name} 「${SCHOOL.source}」(2022 개정 교육과정) 기준이에요. 점선 과목은 앞으로 선택하거나 이미 배운 과목이에요. 🗺️ 탐구 사례는 「모두의 학과별 탐구 지도」(모두의 학종 상담 시리즈 ③, Copyright@All Teachers)에서 가져왔으며, 수록 자료의 저작권은 각 대학에 있어 교내 진학 상담 목적으로만 이용해요.`;

window.addEventListener('hashchange', () => { render(); moveFocus(); });
render();
</script>
